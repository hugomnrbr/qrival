<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style-neo.css"><style>
body{margin:0!important;background:#03070c!important;font-family:Inter,Arial,sans-serif!important;color:#fff!important;overflow:hidden!important}
.demo{width:100%;height:100vh;box-sizing:border-box;padding:8px;display:flex;align-items:flex-start;justify-content:center}.neon-game{width:min(100%,420px);height:100%;box-sizing:border-box;overflow:hidden!important;border:1px solid #1d3140;border-radius:14px;padding:7px!important}
.neon-match-tools{height:18px;text-align:right}.match-forfeit-btn{font-size:8px;padding:5px 8px;border-radius:999px;background:#1b0c16;color:#fff;border:1px solid #c33}
.neon-progress{display:grid!important;grid-template-columns:1fr 10px 1fr;gap:5px;align-items:center;margin:4px 0}.neon-progress>div{height:5px;background:#172532;border-radius:9px;overflow:hidden}.neon-progress i{display:block;height:100%;background:#ffd21a;border-radius:9px}.neon-progress em{width:8px;height:8px;border-radius:50%;background:#ffd21a}
.neon-rounds{display:flex;justify-content:center;gap:5px;margin:5px 0}.neon-rounds span{width:20px;height:20px!important;display:grid;place-items:center;border-radius:50%;font-size:8px}
.neon-question-card{min-height:245px!important;margin-top:7px;padding:12px!important;display:flex;flex-direction:column;justify-content:center}.neon-question-meta{display:flex;justify-content:space-between;align-items:center}.neon-question-card p{font-size:18px!important;text-align:center;line-height:1.25;margin:18px 0!important}.neon-timer{width:43px!important;height:43px!important;display:grid;place-items:center;border:2px solid #20d9ff;border-radius:50%;font-weight:900}.neon-answers{display:grid;gap:6px;margin-top:7px}.neon-answer{min-height:48px!important;border-radius:11px!important;display:grid!important;grid-template-columns:30px 1fr 20px;align-items:center;text-align:left;padding:5px 8px!important}.neon-answer>span{width:26px!important;height:26px!important;display:grid;place-items:center;border:1px solid #536574;border-radius:8px}.neon-answer label{font-weight:800;font-size:11px}
</style></head><body><div class="demo"><div class="neon-game">
<div class="neon-match-tools"><button class="match-forfeit-btn">🚪 DESISTIR</button></div>
<div class="neon-duel-head">
<div class="duel-player-card mine"><div class="duel-player-visual"><div class="neon-avatar-wrap"><span class="avatar-frame-shell has-custom-frame" style="--avatar-size:48px"><span class="avatar neon-avatar"><img class="avatar-base" src="assets/store/avatars/neon.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></span><img class="avatar-frame-overlay" src="assets/store/frames/fire.png"><div class="player-title-below game-title-below"><img class="player-title-image" src="assets/store/titles/campeao.png"></div></span></div></div><div class="duel-player-copy"><b>hugo</b><span>Nível 7</span><strong>18<small> pts</small></strong></div></div>
<div class="neon-vs">VS</div>
<div class="duel-player-card rival"><div class="duel-player-visual"><div class="neon-avatar-wrap"><span class="avatar-frame-shell has-custom-frame"><span class="avatar neon-avatar"><img class="avatar-base" src="assets/store/avatars/cosmic.png" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></span><img class="avatar-frame-overlay" src="assets/store/frames/water.png"><div class="player-title-below game-title-below"><img class="player-title-image" src="assets/store/titles/lenda.png"></div></span></div></div><div class="duel-player-copy"><b>QuizBot</b><span>Nível 12</span><strong>24<small> pts</small></strong></div></div>
</div>
<div class="neon-progress"><div><i style="width:28%"></i></div><em></em><div><i style="width:48%"></i></div></div>
<div class="neon-rounds"><span class="done">✓</span><span class="current">2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
<div class="neon-question-card"><div class="neon-question-meta"><span>PERGUNTA 2 DE 7</span><div class="neon-timer">14</div></div><p>Quem seria o próximo personagem principal se Goku realmente morresse?</p></div>
<div class="neon-answers"><button class="neon-answer"><span>A</span><label>Gohan</label></button><button class="neon-answer"><span>B</span><label>Gotenks</label></button><button class="neon-answer"><span>C</span><label>Vegeta</label></button><button class="neon-answer"><span>D</span><label>Trunks</label></button></div>
</div></div></body></html>
